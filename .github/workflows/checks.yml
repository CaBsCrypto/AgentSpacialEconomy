name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Frontend and agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NODE_ENV: test
      WALLET_RPC_SMOKE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/render-requirements.txt
      - name: Install graphics test dependencies
        run: python -m pip install -r scripts/render-requirements.txt
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Frontend and wallet tests
        run: npm test
      - name: Install agent dependencies
        working-directory: agent
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Agent unit tests
        working-directory: agent
        run: npm test

  contracts:
    name: Contract tests and WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32v1-none
      - name: Test and build every contract without deploying
        shell: bash
        run: |
          set -euo pipefail
          for manifest in contracts/*/Cargo.toml; do
            cargo +1.95.0 test --locked --manifest-path "$manifest"
            cargo +1.95.0 build --locked --release --target wasm32v1-none --manifest-path "$manifest"
          done
