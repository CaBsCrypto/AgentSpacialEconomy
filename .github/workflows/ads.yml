name: Advertising local and database checks
on:
  pull_request:
  push:
    branches:
      - feature/ads-3d-ar-x402
jobs:
  ads:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ads
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: ads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ads -d ads_test"
          --health-interval 5s
          --health-retries 10
    env:
      NODE_ENV: test
      ADS_TEST_DATABASE_URL: postgresql://ads:local-ci-only@localhost:5432/ads_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/render-requirements.txt
      - name: Install locked graphics test dependencies
        run: python -m pip install -r scripts/render-requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm ci --ignore-scripts
        working-directory: agent
      - run: npm test
        working-directory: agent
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 test --locked --manifest-path contracts/ads-registry/Cargo.toml
