services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ads
      POSTGRES_USER: ads
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - ads-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d ads"]
      interval: 5s
      retries: 10
volumes:
  ads-postgres:
